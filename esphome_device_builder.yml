esphome:
  name: waveshare_s3_8di8ro

external_components:
  - source: github://meneerwouters-source/tca9554
    refresh: always

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
ota:
  password: !secret ota_password
  platform: esphome

# Buzzer
output:
  - platform: ledc
    pin: 47
    id: buzzer_out

# I2C bus
i2c:
  sda: 42
  scl: 41
  scan: true

# TCA9554 driver
tca9554:
  id: relay_expander
  address: 0x20

switch:
  - platform: template
    name: "Relay 1"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - lambda: |-
          relay_expander->set_pin(0, true);
    turn_off_action:
      - lambda: |-
          relay_expander->set_pin(0, false);

  - platform: template
    name: "Relay 2"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - lambda: |-
          relay_expander->set_pin(1, true);
    turn_off_action:
      - lambda: |-
          relay_expander->set_pin(1, false);

  - platform: template
    name: "Relay 3"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - lambda: |-
          relay_expander->set_pin(2, true);
    turn_off_action:
