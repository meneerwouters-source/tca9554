          relay_expander->set_pin(2, false);

  - platform: template
    name: "Relay 4"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - lambda: |-
          relay_expander->set_pin(3, true);
    turn_off_action:
      - lambda: |-
          relay_expander->set_pin(3, false);

  - platform: template
    name: "Relay 5"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - lambda: |-
          relay_expander->set_pin(4, true);
    turn_off_action:
      - lambda: |-
          relay_expander->set_pin(4, false);

  - platform: template
    name: "Relay 6"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - lambda: |-
          relay_expander->set_pin(5, true);
    turn_off_action:
      - lambda: |-
          relay_expander->set_pin(5, false);

  - platform: template
    name: "Relay 7"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - lambda: |-
          relay_expander->set_pin(6, true);
    turn_off_action:
      - lambda: |-
          relay_expander->set_pin(6, false);

  - platform: template
    name: "Relay 8"
    optimistic: true
    assumed_state: true
    turn_on_action:
      - lambda: |-
          relay_expander->set_pin(7, true);
    turn_off_action:
      - lambda: |-
          relay_expander->set_pin(7, false);

binary_sensor:
  - platform: gpio
    pin:
      number: 4
      mode: INPUT_PULLDOWN
    name: "Input 1"

  - platform: gpio
    pin:
      number: 5
      mode: INPUT_PULLDOWN
    name: "Input 2"

  - platform: gpio
    pin:
      number: 6
      mode: INPUT_PULLDOWN
    name: "Input 3"

  - platform: gpio
    pin:
      number: 7
      mode: INPUT_PULLDOWN
    name: "Input 4"

  - platform: gpio
    pin:
      number: 8
      mode: INPUT_PULLDOWN
    name: "Input 5"

  - platform: gpio
    pin:
      number: 9
      mode: INPUT_PULLDOWN
    name: "Input 6"

  - platform: gpio
    pin:
      number: 10
      mode: INPUT_PULLDOWN
    name: "Input 7"

  - platform: gpio
    pin:
      number: 11
      mode: INPUT_PULLDOWN
    name: "Input 8"
